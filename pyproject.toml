[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coyomap"
description = "Build and maintain a top-down, drillable map of a codebase."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
# The core gate (validate + render) is stdlib-only by design — keep this empty.
# The structural pre-index's tree-sitter deps live under the `preindex` extra below.
dependencies = []

[project.optional-dependencies]
# Polyglot symbol/import extraction for `coyomap preindex` only. tree-sitter is a
# deliberate, scoped exception to the stdlib-only rule (see internal/docs/design-notes.md).
preindex = [
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2",
]
# Test + type-check tooling. Installed into the repo-local venv by `make dev`, so the gates
# run against the editable package (coyomap importable, no cwd/sys.path tricks).
dev = [
    "pytest>=8",
    "pyright>=1.1",
    # Drives real Chromium for tests/test_viewer_browser.py, the only gate that can see a viewer bug
    # rather than a viewer SOURCE change. Optional at run time: that file skips itself when the driver
    # or the browser binary is missing, the same bargain test_viewer_js.py makes with node. The browser
    # itself is a separate download — `.venv/bin/python -m playwright install chromium`.
    "playwright>=1.40",
    # Runs the suite across processes (`-n`). The gates are 80% browser tests, and those were
    # serial on a many-core machine: 126 of them took 302s of a 412s run. Measured on 2026-09-13,
    # splitting just that file — 1 process 302s, 4 processes 80s, 8 processes 46s. Nothing in the
    # suite shares state across processes (every server binds port 0, every fixture writes to its
    # own temp dir, and `Handler.projects` is a class attribute per interpreter), which is what
    # makes the split safe rather than merely fast.
    "pytest-xdist>=3.5",
]

[project.scripts]
coyomap = "coyomap.cli:main"
# The method-quality eval is a self-contained package (eval/tools/coyomap_eval) with its own command.
coyomap-eval = "coyomap_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]

[tool.setuptools]
# src-layout with the source root named `tools/` (so the repo root reads as method/ + tools/ +
# skill/ — the method and the tools it drives). The package on disk is tools/coyomap/, imported
# as `coyomap`; the dir name matches the import name, so static tools (pyright) resolve it.
# The eval is a SEPARATE, self-contained package under eval/tools/coyomap_eval (imported as
# `coyomap_eval`); it depends on `coyomap` core but the core has no reference back to it.
package-dir = { "" = "tools", "coyomap_eval" = "eval/tools/coyomap_eval" }
packages = ["coyomap", "coyomap.viewer", "coyomap_eval"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
# The generic frontend `coyomap serve` ships from /static/ (the viewer.html shell + css + js); wheel them in.
"coyomap.viewer" = ["viewer.html", "viewer.css", "viewer.js"]
